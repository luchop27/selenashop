{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- page-title -->
<div class="page-title tf-page-title">
    <div class="container-full">
        <div class="row">
            <div class="col-12">
                <div class="heading text-center">{{ page.titulo }}</div>
            </div>
        </div>
    </div>
</div>
<!-- /page-title -->

<!-- main-page -->
<section class="flat-spacing-25">
    <div class="container">
        <div class="tf-main-area-page tf-terms-conditions">
            <!-- Contenido dinámico desde la base de datos -->
            {{ page.contenido|safe }}
        </div>
    </div>
</section>
<!-- /main-page -->
{% endblock %}
